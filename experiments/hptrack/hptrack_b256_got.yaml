DATA:
  MAX_SAMPLE_INTERVAL: 400
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3.5
    FACTOR: 4.0
    SCALE_JITTER: 0.5
    SIZE: 256
    NUMBER: 2
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 3
  TRAIN:
    DATASETS_NAME:
    - GOT10K_train_full
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 60000
MODEL:
  BACKBONE:
    TYPE: "hivit_base"
    STRIDE: 16
    PRETRAIN_FILE: 'mae_hivit_base_1600ep.pth'
    DROP_PATH: 0.1
    POS_TYPE: index # index or interpolate

    GRAD_CKPT: True
    MULTIPLIER: 0.1
    TOKEN_TYPE_INDICATE : True #用于目标掩码
    USE_CONF: False  #用于置信度头
    USE_POOL: False
    USE_MAMBA_S: True #用于模板图像特征聚合
    USE_HP: True #用于多级特征历史提示
    USE_MAMBA_T: True #用于多级特征历史提示 [[10,15],[15,20],[20,25],[25,30]] [[10,18],[18,24],[24,30]]
    LAYER_INDEXES: [[10,18],[18,24],[24,30]]   #[[10,30]] #  #[[10,20],[20,30]] #[[10,14],[14,18],[18,22],[22,26],[26,30]] #[[10,20],[20,30]]#[10,30] #[[10,14]]
    NUM_LAYERS: 3
    D_STATE:  16
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
TRAIN:
  BATCH_SIZE: 8 #64
  EPOCH: 100
  GRAD_CLIP_NORM: 0.1
  LR: 0.0002
  LR_DROP_EPOCH: 80
  NUM_WORKER: 10
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  WEIGHT_DECAY: 0.0001
TEST:
  EPOCH: 100
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  WINDOW: True
  NUM_TEMPLATES: 5
  UPT:
    GOT10K_TEST: 0.0
    OTB: 0.2
  INTER:
    GOT10K_TEST: 1
    OTB: 1
  MB:
    GOT10K_TEST: 500
    OTB: 500