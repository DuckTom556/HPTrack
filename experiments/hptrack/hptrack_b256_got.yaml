DATA:
  MAX_SAMPLE_INTERVAL: 400
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3.5
    FACTOR: 4.0
    SCALE_JITTER: 0.5
    SIZE: 256
    NUMBER: 2
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 3
  TRAIN:
    DATASETS_NAME:
    - GOT10K_train_full
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 60000
MODEL:
  BACKBONE:
    TYPE: "hivit_base"
    STRIDE: 16
    PRETRAIN_FILE: 'mae_hivit_base_1600ep.pth'
    DROP_PATH: 0.1
    POS_TYPE: index

    GRAD_CKPT: True
    MULTIPLIER: 0.1
    TOKEN_TYPE_INDICATE : True
    USE_CONF: False
    USE_POOL: False
    USE_HTFA: True
    USE_MFA:  False
    USE_MFHP: True
    USE_CHPU: True
    LAYER_INDEXES: [[10,18],[18,24],[24,30]]
    NUM_MFHP_LAYERS: 3
    D_STATE:  16
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
TRAIN:
  BATCH_SIZE: 8
  EPOCH: 100
  GRAD_CLIP_NORM: 0.1
  LR: 0.0002
  LR_DROP_EPOCH: 80
  NUM_WORKER: 10
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  WEIGHT_DECAY: 0.0001
TEST:
  EPOCH: 100
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  WINDOW: True
  NUM_TEMPLATES: 5
  UPT:
    GOT10K_TEST: 0.2
  INTER:
    GOT10K_TEST: 1
  MB:
    GOT10K_TEST: 500
